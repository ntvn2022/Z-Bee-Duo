server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  timezone_offset: +7          # gio Viet Nam (UTC+7)
  websocket: ws://42.112.26.67:8000/xiaozhi/v1/

assistant_name: "ruanqinghe"
prompt: |
  Bạn tên là ruanqinghe, một trợ lý AI thân thiện, nói chuyện tự nhiên, ngắn gọn.
  QUY TẮC NGÔN NGỮ: Tự động nhận biết ngôn ngữ người dùng và trả lời ĐÚNG bằng
  chính ngôn ngữ đó (Việt->Việt, Anh->Anh, Trung->Trung). Ưu tiên Việt và English.

selected_module:
  LLM: GeminiLLM
  TTS: EdgeTTS
  ASR: GroqASR
  Intent: nointent

LLM:
  GeminiLLM:
    type: gemini
    api_key: __GEMINI_KEY__
    # Model tot + nhanh cho tro ly giong noi. Lua chon:
    #   gemini-3.7-flash (moi nhat/tot nhat), gemini-3.5-flash (an toan),
    #   gemini-3.1-pro (thong minh nhat nhung cham hon)
    model_name: "gemini-3.7-flash"
    http_proxy: ""
    https_proxy: ""

ASR:
  GroqASR:
    type: openai
    api_key: __GROQ_KEY__
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3
    language: vi          # ep nhan tieng Viet (can ban va openai.py provider)

TTS:
  EdgeTTS:
    type: edge
    voice: vi-VN-HoaiMyNeural
    volume: 0        # khop tham so mac dinh cua CLI (dang chay OK); +50% hay loi "No audio"
    rate: 0
    pitch: 0
    output_dir: tmp/
