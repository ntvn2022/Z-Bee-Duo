name: Build May1 Controller (ESP32-S3, 3 outputs)

# Builds the SECOND ESP32-S3 firmware: a 3-output relay controller that joins
# Wi-Fi, connects to the MQTT broker on the VPS, keeps per-output on/off
# schedules and elapsed timing, and is driven by the voice assistant via the
# xiaozhi server. Wi-Fi + MQTT credentials are provided as run inputs and baked
# into the binary at build time (never committed to the repo).
#
# Output: artifact "may1-controller-firmware" -> merged-binary.bin, flashed at
# offset 0x0 (ESP32-S3), same as the main device.

on:
  workflow_dispatch:
    inputs:
      wifi_ssid:
        description: "Wi-Fi SSID for the controller"
        required: true
      wifi_password:
        description: "Wi-Fi password"
        required: true
      mqtt_host:
        description: "MQTT broker host (VPS public IP)"
        required: true
        default: "42.112.26.67"
      mqtt_port:
        description: "MQTT broker port"
        required: true
        default: "1883"
      mqtt_username:
        description: "MQTT username"
        required: true
        default: "may1"
      mqtt_password:
        description: "MQTT password"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate secrets header from inputs
        env:
          WIFI_SSID: ${{ inputs.wifi_ssid }}
          WIFI_PASSWORD: ${{ inputs.wifi_password }}
          MQTT_HOST: ${{ inputs.mqtt_host }}
          MQTT_PORT: ${{ inputs.mqtt_port }}
          MQTT_USERNAME: ${{ inputs.mqtt_username }}
          MQTT_PASSWORD: ${{ inputs.mqtt_password }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          def c(s): return json.dumps(s if s is not None else "")
          port = os.environ.get("MQTT_PORT", "1883").strip() or "1883"
          h = (
              "// AUTO-GENERATED by CI from workflow inputs. Do not commit.\n"
              "#pragma once\n"
              f"#define WIFI_SSID      {c(os.environ['WIFI_SSID'])}\n"
              f"#define WIFI_PASSWORD  {c(os.environ['WIFI_PASSWORD'])}\n"
              f"#define MQTT_HOST      {c(os.environ['MQTT_HOST'])}\n"
              f"#define MQTT_PORT      {int(port)}\n"
              f"#define MQTT_USERNAME  {c(os.environ['MQTT_USERNAME'])}\n"
              f"#define MQTT_PASSWORD  {c(os.environ['MQTT_PASSWORD'])}\n"
          )
          pathlib.Path("xiaozhi-ai/may1-controller/main/may1_secrets.h").write_text(h)
          print("Wrote may1_secrets.h (SSID/user shown, passwords hidden):")
          print("  WIFI_SSID =", os.environ['WIFI_SSID'])
          print("  MQTT_HOST =", os.environ['MQTT_HOST'], "port", port, "user", os.environ['MQTT_USERNAME'])
          PY

      - name: Build (ESP32-S3)
        shell: bash
        working-directory: xiaozhi-ai/may1-controller
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          source "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          cd build
          esptool.py --chip esp32s3 merge_bin -o merged-binary.bin @flash_args
          ls -l merged-binary.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: may1-controller-firmware
          path: xiaozhi-ai/may1-controller/build/merged-binary.bin
          if-no-files-found: error
