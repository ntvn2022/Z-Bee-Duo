name: Build Vietnamese Firmware (DIYMORE 2.8 touch)

# Builds xiaozhi-esp32 for the DIYMORE / Freenove ES3C28P 2.8" ESP32-S3 board
# with a Vietnamese on-screen UI and the OTA server pointing at the VPS.
# Output: an artifact "diymore-vietnamese-firmware" containing merged-binary.bin,
# which is flashed at offset 0x0 with a phone flasher app (ESP32-S3, compression off).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/esp32-s3-touch-screen-wwelt1
    paths:
      - .github/workflows/build-vietnamese-firmware.yml

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Clone xiaozhi-esp32 v2.4.2
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch v2.4.2 https://github.com/78/xiaozhi-esp32.git xz

      - name: Point default OTA server to the VPS + set wake word to "Jarvis"
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("xz/main/boards/freenove-esp32s3-display-2.8-lcd/config.json")
          cfg = json.loads(p.read_text())
          cfg["builds"][0]["sdkconfig_append"] = [
              'CONFIG_OTA_URL="http://42.112.26.67:8003/ruanqinghe/ota/"',
              # Wake word = "Alexa" (real-recorded WakeNet model, wakes reliably
              # from standby unlike the TTS-generated models). AFE path on S3+PSRAM.
              'CONFIG_USE_AFE_WAKE_WORD=y',
              'CONFIG_SR_WN_WN9_ALEXA=y',
              # Turn OFF the Chinese defaults so only "Jarvis" is packed (no ambiguity).
              # NOTE: the actual default is the _TTS variant.
              'CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS=n',
              'CONFIG_SR_WN_WN9_NIHAOXIAOZHI=n',
              'CONFIG_SR_WN_WN9S_NIHAOXIAOZHI=n',
              'CONFIG_SR_WN_WN9_HILEXIN=n',
              'CONFIG_SR_WN_WN9S_HILEXIN=n',
          ]
          p.write_text(json.dumps(cfg, indent=4))
          print(p.read_text())
          PY

      - name: Show AI answer above the icon (question stays below)
        run: |
          python3 - <<'PY'
          import pathlib
          hp = pathlib.Path("xz/main/display/lcd_display.h"); h = hp.read_text()
          cp = pathlib.Path("xz/main/display/lcd_display.cc"); c = cp.read_text()

          h_anchor = "    lv_obj_t* chat_message_label_ = nullptr;"
          assert h.count(h_anchor) == 1
          h = h.replace(h_anchor, h_anchor + "\n    lv_obj_t* answer_label_ = nullptr;  // AI answer shown above the icon")
          hp.write_text(h)

          setup_anchor = ("    emoji_image_ = lv_img_create(emoji_box_);\n"
                          "    lv_obj_center(emoji_image_);\n"
                          "    lv_obj_add_flag(emoji_image_, LV_OBJ_FLAG_HIDDEN);\n")
          assert c.count(setup_anchor) == 1
          c = c.replace(setup_anchor, setup_anchor +
              "\n    // [custom] AI answer label above the icon: single line, slow horizontal\n"
              "    // marquee that loops forever (keeps cycling while waiting for next question).\n"
              "    answer_label_ = lv_label_create(screen);\n"
              "    lv_obj_set_width(answer_label_, LV_HOR_RES);\n"
              "    lv_label_set_long_mode(answer_label_, LV_LABEL_LONG_MODE_SCROLL_CIRCULAR);\n"
              "    lv_obj_set_style_text_align(answer_label_, LV_TEXT_ALIGN_CENTER, 0);\n"
              "    lv_obj_set_style_text_color(answer_label_, lvgl_theme->text_color(), 0);\n"
              "    lv_obj_set_style_anim_duration(answer_label_, lv_anim_speed(5), 0);\n"
              "    lv_obj_align(answer_label_, LV_ALIGN_TOP_MID, 0, text_font->line_height * 2);\n"
              "    lv_label_set_text(answer_label_, \"\");\n")

          msg_anchor = ("    lv_anim_delete(chat_message_label_, nullptr);\n"
                        "    lv_label_set_text(chat_message_label_, content);\n")
          assert c.count(msg_anchor) == 1
          c = c.replace(msg_anchor,
              "    lv_anim_delete(chat_message_label_, nullptr);\n"
              "    if (answer_label_ != nullptr && role != nullptr && strcmp(role, \"assistant\") == 0) {\n"
              "        lv_label_set_text(answer_label_, content);\n"
              "    } else {\n"
              "        lv_label_set_text(chat_message_label_, content);\n"
              "        if (answer_label_ != nullptr && role != nullptr && strcmp(role, \"user\") == 0) {\n"
              "            lv_label_set_text(answer_label_, \"\");\n"
              "        }\n"
              "    }\n")
          cp.write_text(c)
          print("Patched: AI answer above icon, question below.")
          PY

      - name: Add on-device settings screen (3-tap, password, screen-off slider)
        run: |
          curl -fsSL https://raw.githubusercontent.com/ntvn2022/z-bee-duo/claude/esp32-s3-touch-screen-wwelt1/xiaozhi-ai/firmware/settings_ui.inc \
            -o xz/main/display/settings_ui.inc
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("xz/main/display/lcd_display.cc")
          s = p.read_text()
          if '#include "nvs.h"' not in s:
              s = s.replace('#include "lcd_display.h"',
                            '#include "lcd_display.h"\n#include "nvs.h"', 1)
          # Volume page needs the full AudioCodec definition (board.h only
          # forward-declares it) to call SetOutputVolume.
          if '#include "audio/audio_codec.h"' not in s:
              s = s.replace('#include "nvs.h"',
                            '#include "nvs.h"\n#include "audio/audio_codec.h"', 1)
          # Language page calls Application::GetInstance().WakeWordInvoke(...).
          if '#include "application.h"' not in s:
              s = s.replace('#include "audio/audio_codec.h"',
                            '#include "audio/audio_codec.h"\n#include "application.h"', 1)
          # Unique anchor: the answer_label align line exists only in SetupUI
          # (the plain set_text appears twice, so we can't anchor on that).
          anchor = "lv_obj_align(answer_label_, LV_ALIGN_TOP_MID, 0, text_font->line_height * 2);"
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + '\n#include "settings_ui.inc"')
          p.write_text(s)
          print("Patched: settings screen included into SetupUI")
          PY

      - name: Show weekday + date + time (Vietnamese) in the status bar
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("xz/main/display/lvgl_display/lvgl_display.cc")
          s = p.read_text()

          if "#include <cstdio>" not in s:
              s = s.replace("#include <cstdlib>\n", "#include <cstdlib>\n#include <cstdio>\n", 1)

          anchor = ('                char time_str[16];\n'
                    '                strftime(time_str, sizeof(time_str), "%H:%M", tm);\n'
                    '                SetStatus(time_str);\n')
          assert s.count(anchor) == 1
          s = s.replace(anchor,
              '                // [custom] force Vietnam time (UTC+7): the device clock is\n'
              '                // UTC, so add 7h to the epoch and format via gmtime_r.\n'
              '                time_t vn_t = time(NULL) + 7 * 3600;\n'
              '                struct tm vn_tm;\n'
              '                gmtime_r(&vn_t, &vn_tm);\n'
              '                char time_str[48];\n'
              '                static const char* const vi_wd[] = {"CN","T2","T3","T4","T5","T6","T7"};\n'
              '                snprintf(time_str, sizeof(time_str), "%s %02d/%02d %02d:%02d",\n'
              '                         vi_wd[vn_tm.tm_wday % 7], vn_tm.tm_mday, vn_tm.tm_mon + 1,\n'
              '                         vn_tm.tm_hour, vn_tm.tm_min);\n'
              '                SetStatus(time_str);\n')
          p.write_text(s)
          print("Patched status bar clock: Vietnam time (UTC+7), weekday + dd/mm + HH:MM")
          PY

      - name: Rename Wi-Fi config hotspot to "ruanqinghe"
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("xz/main/boards/common/wifi_board.cc")
          s = p.read_text()
          anchor = 'config.ssid_prefix = "Xiaozhi";'
          assert s.count(anchor) == 1
          s = s.replace(anchor, 'config.ssid_prefix = "ruanqinghe";')
          p.write_text(s)
          print("Hotspot SSID prefix -> ruanqinghe")
          PY

      - name: Auto turn screen off after 5s idle (backlight timeout)
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("xz/main/boards/freenove-esp32s3-display-2.8-lcd/freenove-esp32s3-display-2.8-lcd.cc")
          s = p.read_text()

          # includes
          if "#include <esp_timer.h>" not in s:
              s = s.replace("#include <driver/i2c_master.h>",
                            "#include <driver/i2c_master.h>\n#include <esp_timer.h>", 1)
          if '#include "application.h"' not in s:
              s = s.replace("#include <esp_timer.h>",
                            '#include <esp_timer.h>\n#include "application.h"', 1)
          if '#include "nvs.h"' not in s:
              s = s.replace('#include "application.h"',
                            '#include "application.h"\n#include "nvs.h"', 1)

          # 1) call it at the end of the constructor (do this FIRST, while
          #    SetBrightness(100) still appears exactly once).
          anchor = "GetBacklight()->SetBrightness(100);"
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + "\n        InitializeBacklightTimeout();")

          # 2) members + methods, inserted right before the constructor
          methods = (
              "    // [custom] Turn the screen (backlight) off after 5s idle, on when active.\n"
              "    esp_timer_handle_t bl_timer_ = nullptr;\n"
              "    int bl_idle_ = 0;\n"
              "    volatile bool bl_on_ = true;\n"
              "    // Called from the touch task: ANY tap lights the screen instantly.\n"
              "    // Touch itself is never disabled when the screen is off.\n"
              "    void WakeScreen() {\n"
              "        bl_idle_ = 0;\n"
              "        if (!bl_on_) { GetBacklight()->SetBrightness(100); bl_on_ = true; }\n"
              "    }\n"
              "    int ReadScreenOffSec() {\n"
              "        int v = 5;\n"
              "        nvs_handle_t h;\n"
              "        if (nvs_open(\"ruanqinghe\", NVS_READONLY, &h) == ESP_OK) {\n"
              "            int32_t x; if (nvs_get_i32(h, \"scr_off_s\", &x) == ESP_OK) v = (int)x;\n"
              "            nvs_close(h);\n"
              "        }\n"
              "        return v;\n"
              "    }\n"
              "    void BacklightTick() {\n"
              "        bool idle = (Application::GetInstance().GetDeviceState() == kDeviceStateIdle);\n"
              "        int off = ReadScreenOffSec();\n"
              "        // Never blank the screen while the settings/password overlay is open.\n"
              "        if (!idle || off <= 0 || g_settings_open) {\n"
              "            bl_idle_ = 0;\n"
              "            if (!bl_on_) { GetBacklight()->SetBrightness(100); bl_on_ = true; }\n"
              "            return;\n"
              "        }\n"
              "        if (bl_on_ && ++bl_idle_ >= off) { GetBacklight()->SetBrightness(0); bl_on_ = false; }\n"
              "    }\n"
              "    void InitializeBacklightTimeout() {\n"
              "        esp_timer_create_args_t args = {};\n"
              "        args.callback = [](void* arg){ static_cast<FreenoveESP32S3Display*>(arg)->BacklightTick(); };\n"
              "        args.arg = this;\n"
              "        args.name = \"bl_timeout\";\n"
              "        esp_timer_create(&args, &bl_timer_);\n"
              "        esp_timer_start_periodic(bl_timer_, 1000000);\n"
              "    }\n\n"
          )
          assert s.count("FreenoveESP32S3Display()") >= 1
          s = s.replace("FreenoveESP32S3Display()", methods + "    FreenoveESP32S3Display()", 1)

          p.write_text(s)
          print("Patched: backlight auto-off after 5s idle")
          PY

      - name: Touch -> top area toggles talk, bottom reserved for menu + LVGL touch
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("xz/main/boards/freenove-esp32s3-display-2.8-lcd/freenove-esp32s3-display-2.8-lcd.cc")
          s = p.read_text()

          # ---- 1) includes: pull in esp_lvgl_port (for lvgl_port_lock + lvgl) ----
          if "#include <esp_lvgl_port.h>" not in s:
              s = s.replace('#include "esp_lcd_ili9341.h"',
                            '#include "esp_lcd_ili9341.h"\n#include <esp_lvgl_port.h>', 1)

          # ---- 2) file-scope: coord-mapping flags + shared "menu open" flag ----
          # Touch controller reports raw (rx, ry). Panel uses DISPLAY_SWAP_XY=true,
          # so display_x runs along raw Y (0..319) and display_y along raw X (0..239).
          # If taps land mirrored/rotated on the real device, flip ONE of these to 1
          # and rebuild:  TP_SWAP (axes rotated 90), TP_FLIP_X, TP_FLIP_Y.
          flags = (
              "// [custom] raw-touch -> display coordinate mapping (flip if mirrored)\n"
              "#ifndef TP_SWAP\n#define TP_SWAP 0\n#endif\n"
              "#ifndef TP_FLIP_X\n#define TP_FLIP_X 0\n#endif\n"
              "#ifndef TP_FLIP_Y\n#define TP_FLIP_Y 1\n#endif\n"
              "// Calibration overlay: red dot at the touched point + raw/mapped readout.\n"
              "#ifndef TP_DEBUG\n#define TP_DEBUG 0\n#endif\n"
              "// Only the top portion of the screen toggles listen/talk; the bottom\n"
              "// is reserved for on-screen menus.\n"
              "#define TP_TALK_MAX (DISPLAY_HEIGHT * 60 / 100)\n"
              "// Set true by the settings overlay so raw taps don't toggle talk while open.\n"
              "volatile bool g_settings_open = false;\n\n"
          )
          assert s.count("class TouchDriver {") == 1
          s = s.replace("class TouchDriver {", flags + "class TouchDriver {", 1)

          # ---- 3) class members + helpers, inserted right before the constructor ----
          members = (
              "    // [custom] latest touch point in DISPLAY coords, published by TouchTask\n"
              "    // and consumed by the LVGL pointer indev (single hardware reader).\n"
              "    volatile int32_t tp_x_ = 0;\n"
              "    volatile int32_t tp_y_ = 0;\n"
              "    volatile bool tp_pressed_ = false;\n"
              "    volatile int32_t raw_x_ = 0;  // raw FT6336 coords (for calibration)\n"
              "    volatile int32_t raw_y_ = 0;\n"
              "    bool press_top_ = false;  // did the current press start in the talk area?\n"
              "    lv_indev_t* touch_indev_ = nullptr;\n"
              "    lv_obj_t* dbg_dot_ = nullptr;\n"
              "    lv_obj_t* dbg_lbl_ = nullptr;\n"
              "    static void MapTouch(uint16_t rx, uint16_t ry, int32_t &dx, int32_t &dy) {\n"
              "    #if TP_SWAP\n        dx = rx; dy = ry;\n"
              "    #else\n        dx = ry; dy = rx;\n    #endif\n"
              "    #if TP_FLIP_X\n        dx = (DISPLAY_WIDTH - 1) - dx;\n    #endif\n"
              "    #if TP_FLIP_Y\n        dy = (DISPLAY_HEIGHT - 1) - dy;\n    #endif\n"
              "        if (dx < 0) dx = 0;\n"
              "        if (dx > DISPLAY_WIDTH - 1) dx = DISPLAY_WIDTH - 1;\n"
              "        if (dy < 0) dy = 0;\n"
              "        if (dy > DISPLAY_HEIGHT - 1) dy = DISPLAY_HEIGHT - 1;\n"
              "    }\n"
              "    static void LvglTouchRead(lv_indev_t* indev, lv_indev_data_t* data) {\n"
              "        auto* self = static_cast<FreenoveESP32S3Display*>(lv_indev_get_user_data(indev));\n"
              "        if (self == nullptr) { data->state = LV_INDEV_STATE_RELEASED; return; }\n"
              "        data->point.x = self->tp_x_;\n"
              "        data->point.y = self->tp_y_;\n"
              "        data->state = self->tp_pressed_ ? LV_INDEV_STATE_PRESSED : LV_INDEV_STATE_RELEASED;\n"
              "    #if TP_DEBUG\n"
              "        if (self->dbg_dot_ != nullptr && self->tp_pressed_) {\n"
              "            lv_obj_set_pos(self->dbg_dot_, self->tp_x_ - 8, self->tp_y_ - 8);\n"
              "            lv_obj_remove_flag(self->dbg_dot_, LV_OBJ_FLAG_HIDDEN);\n"
              "            if (self->dbg_lbl_ != nullptr)\n"
              "                lv_label_set_text_fmt(self->dbg_lbl_, \"raw %d,%d  disp %d,%d\",\n"
              "                    (int)self->raw_x_, (int)self->raw_y_, (int)self->tp_x_, (int)self->tp_y_);\n"
              "        }\n"
              "    #endif\n"
              "    }\n"
              "    void InitializeLvglTouch() {\n"
              "        if (!lvgl_port_lock(0)) return;\n"
              "        touch_indev_ = lv_indev_create();\n"
              "        lv_indev_set_type(touch_indev_, LV_INDEV_TYPE_POINTER);\n"
              "        lv_indev_set_read_cb(touch_indev_, LvglTouchRead);\n"
              "        lv_indev_set_user_data(touch_indev_, this);\n"
              "        lv_indev_set_display(touch_indev_, lv_display_get_default());\n"
              "    #if TP_DEBUG\n"
              "        dbg_dot_ = lv_obj_create(lv_layer_top());\n"
              "        lv_obj_set_size(dbg_dot_, 16, 16);\n"
              "        lv_obj_set_style_radius(dbg_dot_, 8, 0);\n"
              "        lv_obj_set_style_bg_color(dbg_dot_, lv_color_hex(0xFF0000), 0);\n"
              "        lv_obj_set_style_bg_opa(dbg_dot_, LV_OPA_COVER, 0);\n"
              "        lv_obj_set_style_border_width(dbg_dot_, 0, 0);\n"
              "        lv_obj_add_flag(dbg_dot_, LV_OBJ_FLAG_HIDDEN);\n"
              "        dbg_lbl_ = lv_label_create(lv_layer_top());\n"
              "        lv_obj_set_style_bg_color(dbg_lbl_, lv_color_hex(0xFFFF00), 0);\n"
              "        lv_obj_set_style_bg_opa(dbg_lbl_, LV_OPA_COVER, 0);\n"
              "        lv_obj_set_style_text_color(dbg_lbl_, lv_color_hex(0x000000), 0);\n"
              "        lv_obj_align(dbg_lbl_, LV_ALIGN_BOTTOM_MID, 0, -2);\n"
              "        lv_label_set_text(dbg_lbl_, \"touch calib\");\n"
              "    #endif\n"
              "        lvgl_port_unlock();\n"
              "    }\n\n"
          )
          assert s.count("FreenoveESP32S3Display()") >= 1
          s = s.replace("FreenoveESP32S3Display()", members + "    FreenoveESP32S3Display()", 1)

          # ---- 4) constructor: register the LVGL indev after touch hw is up ----
          call_anchor = "        InitializeTouch();\n"
          assert s.count(call_anchor) == 1
          s = s.replace(call_anchor, call_anchor + "        InitializeLvglTouch();\n")

          # ---- 5) TouchTask: publish coords + gate talk-toggle to the top area ----
          # Use single-line, indentation-agnostic anchors (robust to formatting).

          # 5a) publish the point (display coords) for the LVGL indev
          read_anchor = "self->touch_.Read(t, x, y);"
          assert s.count(read_anchor) == 1
          s = s.replace(read_anchor, read_anchor +
              "\n"
              "        int32_t dx, dy;  // [custom] publish point for the LVGL indev\n"
              "        FreenoveESP32S3Display::MapTouch(x, y, dx, dy);\n"
              "        self->raw_x_ = x;\n"
              "        self->raw_y_ = y;\n"
              "        self->tp_x_ = dx;\n"
              "        self->tp_y_ = dy;\n"
              "        self->tp_pressed_ = t;")

          # 5b) remember whether the press STARTED in the top (talk) area.
          # (down_start is assigned exactly once, at press-begin.)
          assert s.count("down_start = now;") == 1
          s = s.replace("down_start = now;",
                        "down_start = now; self->press_top_ = (dy < TP_TALK_MAX);"
                        " self->WakeScreen();")

          # 5c) gate the talk actions: only when the press began in the top area
          # and the settings overlay is closed. EnterWifiConfigMode / StartListening
          # appear once (only in TouchTask). ToggleChatState also appears in the
          # boot-button handler, so target only the TouchTask one (it is the toggle
          # immediately followed by "last_tap = now;") and leave the button alone.
          for stmt in ("self->EnterWifiConfigMode();",
                       "app.StartListening();"):
              assert s.count(stmt) == 1, stmt
              s = s.replace(stmt, "if (self->press_top_ && !g_settings_open) " + stmt)
          toggle_pat = re.compile(r"app\.ToggleChatState\(\);(\s*)last_tap = now;")
          assert len(toggle_pat.findall(s)) == 1
          s = toggle_pat.sub(
              r"if (self->press_top_ && !g_settings_open) app.ToggleChatState();\1last_tap = now;",
              s)

          # 5d) faster poll so the indev feeds LVGL smoothly (slider drag) - optional
          if s.count("vTaskDelay(pdMS_TO_TICKS(50));") == 1:
              s = s.replace("vTaskDelay(pdMS_TO_TICKS(50));",
                            "vTaskDelay(pdMS_TO_TICKS(20));")

          p.write_text(s)
          print("Patched: LVGL touch indev + top-only talk gating")
          PY

      - name: Build once to fetch the font component
        shell: bash
        working-directory: xz
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py freenove-esp32s3-display-2.8-lcd --language vi-VN

      - name: Verify wake word = Alexa only (fail fast before font rebuild)
        shell: bash
        working-directory: xz
        run: |
          echo "== Active SR_WN wake-word models in sdkconfig =="
          grep -E '^CONFIG_SR_WN_.*=y' sdkconfig || echo "(none matched)"
          if grep -qE '^CONFIG_SR_WN_.*(NIHAOXIAOZHI|HILEXIN).*=y' sdkconfig; then
            echo "ERROR: a Chinese wake word is still enabled" >&2
            exit 1
          fi
          grep -qE '^CONFIG_SR_WN_WN9_ALEXA=y' sdkconfig \
            && echo "OK: Alexa wake word packed" \
            || { echo "ERROR: Alexa wake word NOT packed" >&2; exit 1; }

      - name: Regenerate basic fonts with FULL Vietnamese coverage
        shell: bash
        working-directory: xz
        run: |
          set -euo pipefail
          # Install lv_font_conv (same tool xiaozhi-fonts uses) + a Noto Sans TTF.
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm
          npm install -g "lv_font_conv@^1.5.3"
          curl -fsSL -o /tmp/NotoSans-Regular.ttf \
            https://raw.githubusercontent.com/googlefonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf

          # Locate the font component's src dir that ships the basic fonts.
          SRC="$(dirname "$(find managed_components -name 'font_noto_sans_basic_16_4.c' | head -1)")"
          if [ -z "$SRC" ]; then echo "ERROR: font component not found" >&2; exit 1; fi
          echo "Font src dir: $SRC"

          # Unicode ranges for complete Vietnamese (precomposed / NFC):
          #  ASCII, Latin-1, Latin Ext-A, Latin Ext-B (Ơ Ư),
          #  Latin Extended Additional (all tone-marked vowels),
          #  visible general punctuation (0x2010-0x2027: dashes, curly quotes,
          #  bullet, ellipsis), and ₫ (0x20AB).
          # NOTE: must NOT include bidi control chars (U+202A-202E, U+2066-2069)
          # or GCC 15 fails the build with -Werror=bidi-chars.
          VN='0x20-0x7F,0xA0-0x17F,0x1A0-0x1B0,0x1EA0-0x1EFF,0x2010-0x2027,0x20AB'

          # Rebuild each basic size/bpp as a drop-in (same symbol names, --no-compress
          # to match the component's uncompressed format).
          for spec in 14:1 16:4 20:4 30:4; do
            size="${spec%:*}"; bpp="${spec#*:}"
            name="font_noto_sans_basic_${size}_${bpp}"
            lv_font_conv --no-compress --no-prefilter --force-fast-kern-format \
              --font /tmp/NotoSans-Regular.ttf --format lvgl --bpp "$bpp" --size "$size" \
              -r "$VN" --lv-font-name "$name" -o "$SRC/${name}.c"
            # A Vietnamese-complete size-16 font is well over 100 KB; basic-only
            # was ~tens of KB. Guard against an empty/failed generation.
            bytes="$(wc -c < "$SRC/${name}.c")"
            echo "Regenerated $name (${bytes} bytes)"
            if [ "$size" = "20" ] && [ "$bytes" -lt 80000 ]; then
              echo "ERROR: $name too small ($bytes) - Vietnamese range likely missing" >&2
              exit 1
            fi
          done

      - name: Rebuild firmware with the Vietnamese font
        shell: bash
        working-directory: xz
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py freenove-esp32s3-display-2.8-lcd --language vi-VN

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: diymore-vietnamese-firmware
          path: xz/build/merged-binary.bin
          if-no-files-found: error
